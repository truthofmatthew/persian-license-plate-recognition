# Copy this file to config.ini and edit it there. config.ini is local and not committed
# (it holds camera credentials); the app reads config.ini if it exists, else this file.
# $PLPR_CONFIG can point at another file.

[ENTRIES]
tablelimit = 100

[MODELCONFIG]
# folder with plate.onnx and chars.onnx (made by scripts/export_onnx.py)
onnxdir = ./model/onnx

[DETECTION]
# minimum detector confidence for a plate box and for each character (0..1)
plate_conf = 0.5
char_conf = 0.5
# run the models on every Nth frame; the other frames are only displayed
process_every_n = 2
# good reads of the same plate before one entry is logged
min_hits = 3

[SOURCEDETECT]
# source = webcam | video | rtsp
source = webcam
webcam = 0
video = anpr_video.mp4
rtsp = rtsp://USER:PASSWORD@CAMERA_IP:554/stream1

[RESOLUTION]
width = 640
height = 480

[DATABASE]
dbentries = ./database/entries.db
dbresidents = ./database/residents.db

[EXTERNAL-SERVICE]
url = http://127.0.0.1:8001/api/v1/camera/
