name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Export ONNX models from model/*.pt
        run: |
          uv venv -p 3.12
          uv pip install --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cpu -e ".[train]"
          uv run --no-sync python scripts/export_onnx.py
      - uses: actions/upload-artifact@v4
        with:
          name: onnx-models
          path: model/onnx/

  python:
    needs: models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: onnx-models
          path: model/onnx/
      - uses: astral-sh/setup-uv@v6
      - name: Qt system libraries (offscreen PySide6)
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: |
          uv venv -p 3.12
          uv pip install -e ".[server,desktop,dev]"
          uv run --no-sync ruff check plpr scripts server tests trainer
          QT_QPA_PLATFORM=offscreen uv run --no-sync pytest -q

  web:
    needs: models
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: onnx-models
          path: model/onnx/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run models
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
